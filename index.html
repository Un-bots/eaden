<!DOCTYPE html>
<html>
<head>
  <title>Eaden</title>
</head>
<body style="font-family:sans-serif; text-align:center; padding:40px;">
  <h1>🎙️ Eaden</h1>
  <button id="startBtn" style="font-size:20px; padding:15px 30px;">Activate Eaden</button>
  <p id="status" style="font-size:16px; color:gray;">Not listening</p>
  <p id="output" style="font-size:18px; margin-top:20px;"></p>
  <p id="reply" style="font-size:18px; margin-top:10px; color:#2a6;"></p>

  <script>
    const output = document.getElementById('output');
    const replyEl = document.getElementById('reply');
    const status = document.getElementById('status');
    const startBtn = document.getElementById('startBtn');

    const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.lang = 'en-US';
    recognition.continuous = true;
    recognition.interimResults = false;

    let active = false;
    let awaitingQuestion = false;

    startBtn.onclick = () => {
      active = true;
      status.textContent = "Listening for 'Eaden'...";
      recognition.start();
    };

    function speak(text) {
      const speech = new SpeechSynthesisUtterance(text);
      window.speechSynthesis.speak(speech);
    }

    async function askGemini(question) {
      status.textContent = "Thinking...";
      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: question })
        });
        const data = await res.json();
        replyEl.textContent = "Eaden: " + data.reply;
        speak(data.reply);
      } catch (err) {
        replyEl.textContent = "Error reaching Eaden's brain.";
      }
      status.textContent = "Listening for 'Eaden'...";
    }

    recognition.onresult = (event) => {
      const lastResult = event.results[event.results.length - 1];
      const text = lastResult[0].transcript.trim().toLowerCase();
      output.textContent = "Heard: " + text;

      const wakeWords = ["eaden", "eden", "aiden", "aden"];
      const hasWake = wakeWords.some(w => text.includes(w));

      if (awaitingQuestion) {
        awaitingQuestion = false;
        askGemini(text);
      } else if (hasWake) {
        status.textContent = "Wake word detected! Ask your question...";
        speak("Yes? I'm listening.");
        awaitingQuestion = true;
      }
    };

    recognition.onerror = (event) => {
      status.textContent = "Error: " + event.error;
    };

    recognition.onend = () => {
      if (active) recognition.start();
    };
  </script>
</body>
</html>
